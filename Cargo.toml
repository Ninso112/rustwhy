[package]
name = "rustwhy"
version = "0.1.0"
edition = "2021"
description = "Unified Linux system diagnostics - understand WHY things happen"
license = "GPL-3.0"
authors = ["Ninso112"]
repository = "https://github.com/Ninso112/rustwhy"
homepage = "https://github.com/Ninso112/rustwhy"
documentation = "https://github.com/Ninso112/rustwhy#readme"
readme = "README.md"
keywords = ["linux", "diagnostics", "system", "cli", "monitoring"]
categories = ["command-line-utilities", "os::linux-apis"]

[badges]
github = { repository = "Ninso112/rustwhy", workflow = "CI" }

[[bin]]
name = "rustwhy"
path = "src/main.rs"

[dependencies]
# CLI Framework
clap = { version = "4", features = ["derive", "color", "suggestions", "wrap_help", "env"] }
clap_complete = "4"

# Async
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# System Information
sysinfo = "0.31"

# Terminal UI
colored = "2"
tabled = "0.16"

# Error Handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
bytesize = "1"
humantime = "2"
users = "0.11"
which = "6"

[features]
default = []
nvidia = []
all = ["nvidia"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
